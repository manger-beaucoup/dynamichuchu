<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실무용 퇴직금 계산기</title>
    <style>
      :root {
        font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f3f6fb; color: #0f172a; }
      .wrap { max-width: 1200px; margin: 28px auto; padding: 16px; display: grid; gap: 14px; }
      .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        border: 1px solid #e5e7eb;
        padding: 16px;
      }
      h1 { margin: 0; font-size: 1.55rem; }
      h2 { margin: 0 0 12px 0; font-size: 1.1rem; }
      .desc { margin: 8px 0 0 0; color: #475569; }
      .toolbar { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 14px; }
      .field { display: grid; gap: 6px; }
      label { color: #334155; font-weight: 600; font-size: 14px; }
      select, button {
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        font-size: 14px;
      }
      .run { background: #1d4ed8; color: #fff; border: none; font-weight: 700; cursor: pointer; }
      .run:hover { background: #1e40af; }
      .ghost { background: #fff; color: #1e40af; border: 1px solid #93c5fd; cursor: pointer; }
      .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #334155; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .kpi { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 12px; }
      .kpi .label { color: #334155; font-size: 12px; }
      .kpi .value { margin-top: 4px; font-size: 1.05rem; font-weight: 700; }
      .meta-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
      .meta-list li { color: #334155; font-size: 14px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: left; }
      th { background: #f8fafc; color: #334155; }
      .mono {
        margin: 0;
        white-space: pre-wrap;
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 12px;
        padding: 12px;
        max-height: 320px;
        overflow: auto;
        font-size: 13px;
        line-height: 1.4;
      }
      .muted { color: #64748b; font-size: 13px; }
      .scenario-best { color: #166534; font-weight: 700; }
      @media (max-width: 980px) {
        .toolbar { grid-template-columns: 1fr; }
        .grid-2 { grid-template-columns: 1fr; }
        .kpis { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>실무용 퇴직금 계산기</h1>
        <p class="desc">근속/평균임금/퇴직금 엔진 분리 + 휴직보정 규칙 토글 + 시나리오 비교 + 산식 로그</p>

        <div class="toolbar">
          <div class="field">
            <label for="employeeSelect">직원 선택</label>
            <select id="employeeSelect"></select>
          </div>
          <label class="toggle"><input type="checkbox" id="leaveCorrectionToggle" /> 휴직 보정 사용</label>
          <label class="toggle"><input type="checkbox" id="allowanceToggle" checked /> 수당 포함</label>
          <div style="display:flex; gap:8px;">
            <button id="runButton" class="run" type="button">재계산</button>
            <button id="copyLogsButton" class="ghost" type="button">로그 복사</button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>결과 요약</h2>
        <div id="kpiRows" class="kpis"></div>
        <p id="resultSummary" class="muted"></p>
      </section>

      <section class="grid-2">
        <article class="card">
          <h2>직원/기본정보</h2>
          <ul id="employeeMeta" class="meta-list"></ul>

          <h2 style="margin-top:14px;">휴직/변동 이력</h2>
          <table>
            <thead>
              <tr><th>종류</th><th>기간</th><th>근속산입</th><th>보정규칙</th></tr>
            </thead>
            <tbody id="leaveRows"></tbody>
          </table>
        </article>

        <article class="card">
          <h2>최근 급여(12개월 뷰)</h2>
          <table>
            <thead>
              <tr><th>월</th><th>기본급</th><th>수당</th><th>상여</th></tr>
            </thead>
            <tbody id="payrollRows"></tbody>
          </table>
        </article>
      </section>

      <section class="card">
        <h2>시나리오 비교 (기본 / 휴직보정 / 임금피크)</h2>
        <table>
          <thead>
            <tr>
              <th>시나리오</th>
              <th>평균월임금</th>
              <th>근속연수</th>
              <th>퇴직금</th>
              <th>기본 대비</th>
            </tr>
          </thead>
          <tbody id="scenarioRows"></tbody>
        </table>
      </section>

      <section class="card">
        <h2>중간 산식 로그</h2>
        <pre id="calcLogs" class="mono" aria-live="polite"></pre>
      </section>
    </main>

    <script type="module" src="./src/index.js"></script>
  </body>
</html>
